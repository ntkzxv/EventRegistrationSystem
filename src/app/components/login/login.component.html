<div class="auth-page">

  <div class="auth-card">

    <!-- ================= HEADER ================= -->

    <div class="auth-header">

      <div class="logo-icon">

        <svg
          width="27"
          height="27"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect
            x="3"
            y="4"
            width="18"
            height="17"
            rx="2"
          ></rect>

          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>

      </div>

      <h1>
        EventHub Thailand
      </h1>

      <p>
        เข้าสู่ระบบเพื่อจัดการและลงทะเบียนกิจกรรมของคุณ
      </p>

    </div>


    <!-- ================= TABS ================= -->
    <div class="auth-tabs">
      <button
        type="button"
        class="tab-button active"
      >
        เข้าสู่ระบบ
      </button>

      <a
        routerLink="/register"
        class="tab-button"
        style="text-decoration: none; display: flex; align-items: center; justify-content: center;"
      >
        สมัครสมาชิก
      </a>
    </div>


    <!-- ================= LOGIN FORM ================= -->

    <form
      class="auth-form"
      (ngSubmit)="login()"
    >

      <!-- EMAIL -->

      <div class="form-group">

        <label for="loginEmail">
          อีเมล (Email)
          <span>*</span>
        </label>

        <input
          id="loginEmail"
          type="email"
          name="loginEmail"
          [(ngModel)]="email"
          placeholder="example@email.com"
          autocomplete="email"
        />

      </div>


      <!-- PASSWORD -->

      <div class="form-group">

        <label for="loginPassword">
          รหัสผ่าน (Password)
          <span>*</span>
        </label>

        <div class="password-wrapper">

          <input
            id="loginPassword"
            [type]="showPassword() ? 'text' : 'password'"
            name="loginPassword"
            [(ngModel)]="password"
            placeholder="กรอกรหัสผ่าน"
            autocomplete="current-password"
          />

          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
            aria-label="แสดงหรือซ่อนรหัสผ่าน"
          >

            @if (showPassword()) {

              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                ></path>

                <circle
                  cx="12"
                  cy="12"
                  r="3"
                ></circle>
              </svg>

            } @else {

              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M3 3l18 18"></path>

                <path
                  d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
                ></path>

                <path
                  d="M9.9 4.2A10.4 10.4 0 0 1 12 4c6.5 0 10 8 10 8a16 16 0 0 1-2.2 3.3"
                ></path>

                <path
                  d="M6.6 6.6C3.5 8.5 2 12 2 12s3.5 8 10 8c1.4 0 2.6-.3 3.7-.8"
                ></path>
              </svg>

            }

          </button>

        </div>

      </div>


      <!-- ERROR -->

      @if (errorMessage()) {

        <div class="error-message">
          {{ errorMessage() }}
        </div>

      }


      <!-- LOGIN BUTTON -->
      <button
        type="submit"
        class="primary-button"
      >
        เข้าสู่ระบบ
      </button>

      <!-- REGISTER LINK PROMPT -->
      <div class="register-prompt-row">
        <span class="no-account-text">ยังไม่มีบัญชีผู้ใช้?</span>
        <a routerLink="/register" class="register-link-btn">
          สมัครสมาชิก
        </a>
      </div>
    </form>
  </div>
</div>
